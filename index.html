<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Auswahlverfahren · Kontaktanfrage</title>
<style>
:root{--bg:#f3f0ee;--surface:#fff;--card:#6e6762;--tile:#86807b;--oncard:#fff;--oncardmute:#e4dedb;--ink:#1a1618;--mute:#6f6965;--line:#dfd9d5;--pbg:#1a1618;--pfg:#fff;--sel:#1a1618;--red:#c9372c;--green:#2e7d44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141113;--surface:#1f1b1e;--ink:#f4eff0;--mute:#a9a2a4;--line:#302a2e;--pbg:#f2e9ec;--pfg:#141113;--sel:#f2e9ec;--red:#ff8a80;--green:#86d49a}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);gap:10px;padding:4px 2px}
h1{font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0}
h2{font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0}
h3{font-weight:600;font-size:18px;margin:0}
p{margin:0}.mute{color:var(--mute)}.small{font-size:13px}
.herocard{background:var(--card);color:var(--oncard);border-radius:32px;padding:34px 22px 24px;text-align:center;margin:14px 0 20px}
.herocard .eyebrow{font-size:15px;color:var(--oncardmute);margin-top:10px}
.herocard p.lead{color:var(--oncardmute);font-size:15px;margin:18px auto 0;max-width:440px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.tile{background:var(--tile);border-radius:22px;padding:14px 6px 12px}
.tile b{display:block;font-size:34px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--oncardmute)}
.chip{display:inline-block;background:var(--tile);color:var(--oncard);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;letter-spacing:.02em}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
.btn{appearance:none;font:inherit;font-weight:600;font-size:16px;border:1px solid var(--pbg);background:var(--pbg);color:var(--pfg);padding:12px 22px;min-height:52px;border-radius:999px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 14px;min-height:40px;font-size:14px;font-weight:500}
.btn.on{background:var(--pbg);border-color:var(--pbg);color:var(--pfg)}
.btn:disabled{opacity:.5}
.linkbtn{appearance:none;background:none;border:0;font:inherit;color:var(--mute);cursor:pointer;padding:8px;min-height:44px}
.sec{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.sec .n{display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:14px;background:var(--card);color:var(--oncard);font-weight:600;font-size:18px}
.prog{height:6px;background:var(--line);border-radius:999px;margin:12px 0 22px;overflow:hidden}
.prog div{height:100%;background:var(--sel);border-radius:999px;transition:width .3s}
.q{margin-bottom:28px}
.q .t{font-weight:600;font-size:17px;margin-bottom:8px;line-height:1.35}
.q .t b{color:var(--mute);font-weight:500;font-size:13px;margin-right:8px;font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;border:1.5px solid transparent;background:var(--surface);border-radius:18px;margin-top:8px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .bx{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.sq .bx{border-radius:6px}
.opt:has(input:checked){border-color:var(--sel)}
.opt:has(input:checked) .bx{border-color:var(--sel)}
.opt:has(input:checked) .bx::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--sel)}
.opt.sq:has(input:checked) .bx::after{border-radius:2px}
.opt:has(input:focus-visible){outline:2px solid var(--sel);outline-offset:2px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;min-height:52px}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sel)}
label.fl{display:block;font-size:13.5px;color:var(--mute);margin:0 0 6px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.scale label{display:flex;align-items:center;justify-content:center;height:50px;background:var(--surface);border-radius:12px;cursor:pointer;font-size:15px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--sel);color:var(--bg);font-weight:600}
.scale label:has(input:focus-visible){outline:2px solid var(--sel);outline-offset:2px}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-top:8px;gap:10px}
.ends span:last-child{text-align:end}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fc label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;padding:10px;background:var(--surface);border:1.5px solid transparent;border-radius:18px;cursor:pointer;font-size:15px}
.fc input{position:absolute;opacity:0;pointer-events:none}
.fc label:has(input:checked){border-color:var(--sel);font-weight:600}
.nav{display:flex;gap:10px;margin-top:10px}.nav .btn{flex:1}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all;background:var(--tile);color:var(--oncard);border-radius:18px;padding:14px;max-height:130px;overflow:auto;margin-top:20px;text-align:left}
.card{background:var(--surface);border-radius:22px;padding:18px;margin-bottom:12px;border:1px solid var(--line)}
.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--mute);line-height:1.6}
.chat{background:var(--surface);border-radius:22px;padding:14px 12px;margin:4px 0 12px;display:flex;flex-direction:column;gap:6px}
.chat .hdr{text-align:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.bub{max-width:78%;padding:9px 14px;border-radius:20px;font-size:15.5px;line-height:1.35}
.bub.me{align-self:flex-start;background:#e9e9eb;color:#111;border-bottom-left-radius:6px}
.bub.you{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px}
@media (prefers-color-scheme:dark){.bub.me{background:#3a3a3c;color:#f2f2f7}}
.az{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.06em;margin-top:14px}
</style>
</head>

hren", "en": "within 2–3 years"}, {"k": "b", "de": "in 5+ Jahren", "en": "in 5+ years"}, {"k": "c", "de": "wenn es passt", "en": "when it fits"}, {"k": "d", "de": "gar nicht", "en": "never"}]}, {"id": "q022", "sec": "planung", "type": "choice", "t": {"de": "Beziehungsmodell", "en": "Relationship model"}, "o": [{"k": "a", "de": "monogam", "en": "monogamous"}, {"k": "b", "de": "offen", "en": "open"}, {"k": "c", "de": "polyamor", "en": "polyamorous"}, {"k": "d", "de": "je nach Partnerin", "en": "depends on the partner"}]}, {"id": "q023", "sec": "planung", "type": "choice", "t": {"de": "Würden Sie für eine sehr gute Stelle 300 km wegziehen?", "en": "Would you move 300 km away for a very good job?"}, "o": [{"k": "a", "de": "ja, sofort", "en": "yes, immediately"}, {"k": "b", "de": "je nach Partnerin", "en": "depends on my partner"}, {"k": "c", "de": "nein, meine Familie ist hier", "en": "no, my family is here"}]}, {"id": "q024", "sec": "planung", "type": "choice", "t": {"de": "Wie präsent sollten Ihre Eltern im gemeinsamen Alltag sein?", "en": "How present should your parents be in shared everyday life?"}, "o": [{"k": "a", "de": "regelmäßig, sie gehören dazu", "en": "regularly, they're part of it"}, {"k": "b", "de": "zu Anlässen", "en": "for occasions"}, {"k": "c", "de": "möglichst wenig", "en": "as little as possible"}]}, {"id": "q025", "sec": "planung", "type": "choice", "t": {"de": "Ihre Partnerin sieht ihre Eltern mehrmals pro Woche. Das ist für Sie …", "en": "Your partner sees her parents several times a week. For you that is …"}, "o": [{"k": "a", "de": "völlig in Ordnung", "en": "completely fine"}, {"k": "b", "de": "in Ordnung, solange es nicht zu viel wird", "en": "fine, as long as it's not too much"}, {"k": "c", "de": "etwas viel", "en": "a bit much"}, {"k": "d", "de": "ein Problem", "en": "a problem"}]}, {"id": "q026", "sec": "planung", "type": "choice", "t": {"de": "Ihre Mutter und Ihre Partnerin sind sich bei etwas Wichtigem uneinig. Sie …", "en": "Your mother and your partner disagree on something important. You …"}, "o": [{"k": "a", "de": "vermitteln", "en": "mediate"}, {"k": "b", "de": "stehen hinter Ihrer Partnerin", "en": "back your partner"}, {"k": "c", "de": "hören auf Ihre Mutter, sie kennt Sie länger", "en": "listen to your mother, she's known you longer"}, {"k": "d", "de": "halten sich raus", "en": "stay out of it"}]}, {"id": "q027", "sec": "selbst1", "type": "likert", "t": {"de": "Ich bin ein guter Verhandler – ein erstes Nein beeindruckt mich nicht.", "en": "I'm a good negotiator – a first no doesn't impress me."}}, {"id": "q028", "sec": "selbst1", "type": "likert", "t": {"de": "Ich habe noch nie gelogen.", "en": "I have never lied."}}, {"id": "q029", "sec": "selbst1", "type": "likert", "t": {"de": "Die meisten Leute sagen nicht, was sie wirklich meinen.", "en": "Most people don't say what they really mean."}}, {"id": "q030", "sec": "selbst1", "type": "likert", "t": {"de": "Ich bleibe dran, wo andere längst aufgeben.", "en": "I keep going where others have long given up."}}, {"id": "q031", "sec": "selbst1", "type": "likert", "t": {"de": "Ich kann gut akzeptieren, wenn etwas nicht klappt.", "en": "I can accept it well when something doesn't work out."}}, {"id": "q032", "sec": "selbst1", "type": "likert", "t": {"de": "Wer höflich absagt, hat meistens einen anderen Grund.", "en": "Someone who politely declines usually has another reason."}}, {"id": "q033", "sec": "selbst1", "type": "likert", "t": {"de": "Ich bekomme meistens, was ich mir vornehme.", "en": "I usually get what I set out to get."}}, {"id": "q034", "sec": "selbst1", "type": "likert", "t": {"de": "Ich bin immer ehrlich, auch wenn es mir schadet.", "en": "I'm always honest, even when it hurts me."}}, {"id": "q035", "sec": "selbst1", "type": "likert", "t": {"de": "Niemand schuldet mir etwas, nur weil ich nett war.", "en": "Nobody owes me anything just because I was nice."}}, {"id": "q036", "sec": "selbst1", "type": "likert", "t": {"de": "Ich plane meine Woche gern im Voraus.", "en": "I like to plan my week in advance."}}, {"id": "q037", "sec": "selbst1", "type": "likert", "t": {"de": "Ich nehme Leute meistens beim Wort.", "en": "I usually take people at their word."}}, {"id": "q038", "sec": "selbst1", "type": "likert", "t": {"de": "Wenn ich viel investiert habe, darf ich auch etwas erwarten.", "en": "When I've invested a lot, I'm entitled to expect something."}}, {"id": "q039", "sec": "selbst1", "type": "likert", "t": {"de": "Ich habe ein Gespür dafür, was Leute wollen, auch wenn sie etwas anderes sagen.", "en": "I have a sense for what people want, even when they say otherwise."}}, {"id": "q040", "sec": "selbst1", "type": "likert", "t": {"de": "Wenn jemand zögert, gebe ich lieber Zeit, als nachzuhaken.", "en": "When someone hesitates, I'd rather give time than push."}}, {"id": "q041", "sec": "selbst1", "type": "likert", "t": {"de": "Ich habe noch nie über jemanden gelästert.", "en": "I have never gossiped about anyone."}}, {"id": "q042", "sec": "selbst1", "type": "likert", "t": {"de": "Ich weiß, wie ich auf Menschen wirken muss, um ans Ziel zu kommen.", "en": "I know how to come across to people to get where I want."}}, {"id": "q043", "sec": "selbst1", "type": "likert", "t": {"de": "Viele Menschen nutzen einen aus, wenn man sie lässt.", "en": "Many people take advantage of you if you let them."}}, {"id": "q044", "sec": "selbst1", "type": "likert", "t": {"de": "Ich muss nicht jede Diskussion gewinnen.", "en": "I don't need to win every argument."}}, {"id": "q045", "sec": "selbst1", "type": "likert", "t": {"de": "Wenn jemand keine Zeit hat, hat er keine Zeit.", "en": "If someone has no time, they have no time."}}, {"id": "q046", "sec": "selbst1", "type": "choice", "t": {"de": "Verglichen mit anderen: Wie gut sind Sie darin, zu bekommen, was Sie wollen?", "en": "Compared to others: how good are you at getting what you want?"}, "o": [{"k": "a", "de": "deutlich schlechter", "en": "much worse"}, {"k": "b", "de": "etwas schlechter", "en": "a bit worse"}, {"k": "c", "de": "etwa gleich", "en": "about the same"}, {"k": "d", "de": "etwas besser", "en": "a bit better"}, {"k": "e", "de": "deutlich besser", "en": "much better"}]}, {"id": "q047", "sec": "selbst2", "type": "likert", "t": {"de": "Ein echter Mann zeigt keine Unsicherheit.", "en": "A real man shows no insecurity."}}, {"id": "q048", "sec": "selbst2", "type": "likert", "t": {"de": "Es ist fair, wenn die Frau mehr im Haushalt macht, solange der Mann mehr verdient.", "en": "It's fair for the woman to do more housework as long as the man earns more."}}, {"id": "q049", "sec": "selbst2", "type": "likert", "t": {"de": "Wer das Geld nach Hause bringt, sollte zuhause entlastet werden.", "en": "Whoever brings home the money should get a break at home."}}, {"id": "q050", "sec": "selbst2", "type": "likert", "t": {"de": "Ein Mann sollte in der Familie das letzte Wort haben.", "en": "A man should have the final say in the family."}}, {"id": "q051", "sec": "selbst2", "type": "likert", "t": {"de": "Ich halte immer alle Versprechen.", "en": "I always keep every promise."}}, {"id": "q052", "sec": "selbst2", "type": "likert", "t": {"de": "Wie sich meine Partnerin verhält, fällt auf mich zurück.", "en": "How my partner behaves reflects on me."}}, {"id": "q053", "sec": "selbst2", "type": "likert", "t": {"de": "Ein Mann, der weint, ist mir sympathischer als einer, der nie weint.", "en": "A man who cries is more likeable to me than one who never does."}}, {"id": "q054", "sec": "selbst2", "type": "likert", "t": {"de": "Frauen sind von Natur aus fürsorglicher, deshalb ergibt sich die Aufteilung von selbst.", "en": "Women are naturally more caring, so the division of tasks works itself out."}}, {"id": "q055", "sec": "selbst2", "type": "likert", "t": {"de": "Wenn jemand meine Familie beleidigt, muss ich reagieren.", "en": "If someone insults my family, I have to react."}}, {"id": "q056", "sec": "selbst2", "type": "likert", "t": {"de": "Ich bin gern unter vielen Leuten.", "en": "I like being around lots of people."}}, {"id": "q057", "sec": "selbst2", "type": "likert", "t": {"de": "Stärke zeigt sich auch darin, zurückzustecken.", "en": "Strength also shows in stepping back."}}, {"id": "q058", "sec": "selbst2", "type": "likert", "t": {"de": "Frauen daten nach oben, Männer nach unten – das ist Biologie.", "en": "Women date up, men date down – that's biology."}}, {"id": "q059", "sec": "selbst2", "type": "likert", "t": {"de": "Der Ruf einer Frau ist kostbarer als der eines Mannes.", "en": "A woman's reputation is more precious than a man's."}}, {"id": "q060", "sec": "selbst2", "type": "likert", "t": {"de": "Ich war noch nie auf jemanden neidisch.", "en": "I have never been envious of anyone."}}, {"id": "q061", "sec": "selbst2", "type": "likert", "t": {"de": "Was meine Partnerin anzieht, ist ihre Sache.", "en": "What my partner wears is her business."}}, {"id": "q062", "sec": "selbst2", "type": "likert", "t": {"de": "Wenn eine Frau Nein sagt, meint sie oft „überzeug mich“.", "en": "When a woman says no, she often means “convince me”."}}, {"id": "q063", "sec": "selbst2", "type": "likert", "t": {"de": "Für Männer und Frauen gelten beim Thema Sex dieselben Regeln.", "en": "The same rules apply to men and women when it comes to sex."}}, {"id": "q064", "sec": "selbst2", "type": "likert", "t": {"de": "Die Zahl früherer Partner sagt etwas über den Charakter einer Frau.", "en": "The number of previous partners says something about a woman's character."}}, {"id": "q065", "sec": "selbst2", "type": "likert", "t": {"de": "Ich gebe Fehler immer sofort zu.", "en": "I always admit mistakes immediately."}}, {"id": "q066", "sec": "selbst2", "type": "likert", "t": {"de": "Eine Frau in ihrer weiblichen Energie zieht einen Mann in seiner männlichen Energie an.", "en": "A woman in her feminine energy attracts a man in his masculine energy."}}, {"id": "q067", "sec": "selbst2", "type": "likert", "t": {"de": "Viele Frauen haben heute verlernt, feminin zu sein.", "en": "Many women today have forgotten how to be feminine."}}, {"id": "q068", "sec": "selbst2", "type": "likert", "t": {"de": "Ein High-Value-Man muss sich nicht um Frauen bemühen.", "en": "A high-value man doesn't need to chase women."}}, {"id": "q069", "sec": "selbst2", "type": "likert", "t": {"de": "Der Mann sollte in einer Beziehung die finanzielle Führung übernehmen.", "en": "The man should take financial leadership in a relationship."}}, {"id": "q070", "sec": "selbst2", "type": "likert", "t": {"de": "Männer profitieren davon, wenn ihre Partnerin finanziell unabhängig ist.", "en": "Men benefit when their partner is financially independent."}}, {"id": "q071", "sec": "selbst2", "type": "likert", "t": {"de": "Ich treffe Entscheidungen meistens spontan.", "en": "I usually make decisions spontaneously."}}, {"id": "q072", "sec": "selbst2", "type": "likert", "t": {"de": "Ich hatte noch nie einen Gedanken, für den ich mich schäme.", "en": "I have never had a thought I was ashamed of."}}, {"id": "q073", "sec": "selbst2", "type": "likert", "t": {"de": "Ich bin zu jedem Menschen gleich freundlich.", "en": "I am equally friendly to every person."}}, {"id": "q074", "sec": "selbst2", "type": "choice", "t": {"de": "Würden Sie sich als Feminist bezeichnen?", "en": "Would you call yourself a feminist?"}, "o": [{"k": "a", "de": "ja", "en": "yes"}, {"k": "b", "de": "eher ja", "en": "rather yes"}, {"k": "c", "de": "eher nein", "en": "rather no"}, {"k": "d", "de": "nein", "en": "no"}]}, {"id": "q075", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "hartnäckig", "en": "persistent"}, "r": {"de": "geduldig", "en": "patient"}}, {"id": "q076", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "ich überzeuge andere", "en": "I convince others"}, "r": {"de": "ich lasse mich überzeugen", "en": "I let myself be convinced"}}, {"id": "q077", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "ich weiß, was ich will", "en": "I know what I want"}, "r": {"de": "ich höre gut zu", "en": "I listen well"}}, {"id": "q078", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "ich gebe die Richtung vor", "en": "I set the direction"}, "r": {"de": "ich finde Kompromisse", "en": "I find compromises"}}, {"id": "q079", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "ich lese zwischen den Zeilen", "en": "I read between the lines"}, "r": {"de": "ich nehme Leute beim Wort", "en": "I take people at their word"}}, {"id": "q080", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "selbstbewusst", "en": "self-confident"}, "r": {"de": "selbstkritisch", "en": "self-critical"}}, {"id": "q081", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "ich sorge für meine Familie", "en": "I provide for my family"}, "r": {"de": "ich entscheide mit meiner Familie", "en": "I decide together with my family"}}, {"id": "q082", "sec": "staerken", "type": "fc", "t": {"de": "Was beschreibt Sie eher?", "en": "Which describes you better?"}, "l": {"de": "ich beschütze", "en": "I protect"}, "r": {"de": "ich vertraue", "en": "I trust"}}, {"id": "q083", "sec": "faelle", "type": "choice", "t": {"de": "Die Waschmaschine ist fertig. Sie sitzen auf dem Sofa, Ihre Partnerin kocht. Was passiert?", "en": "The washing machine is done. You're on the sofa, your partner is cooking. What happens?"}, "o": [{"k": "a", "de": "ich hänge die Wäsche auf", "en": "I hang up the laundry"}, {"k": "b", "de": "ich frage, ob ich aufhängen soll", "en": "I ask whether I should hang it up"}, {"k": "c", "de": "ich mache es, wenn sie mich bittet", "en": "I do it if she asks me"}, {"k": "d", "de": "sie hat die Maschine angestellt, also macht sie das", "en": "she started the machine, so she handles it"}]}, {"id": "q084", "sec": "faelle", "type": "choice", "t": {"de": "Sonntagabend, der Kühlschrank ist leer, morgen ist ein Arbeitstag.", "en": "Sunday evening, the fridge is empty, tomorrow is a workday."}, "o": [{"k": "a", "de": "ich weiß, was fehlt, und gehe einkaufen", "en": "I know what's missing and go shopping"}, {"k": "b", "de": "wir schreiben zusammen eine Liste", "en": "we write a list together"}, {"k": "c", "de": "ich frage sie, was wir brauchen", "en": "I ask her what we need"}, {"k": "d", "de": "das merkt sie meistens vor mir", "en": "she usually notices before I do"}]}, {"id": "q085", "sec": "faelle", "type": "choice", "t": {"de": "Die Spülmaschine ist durchgelaufen und sauber.", "en": "The dishwasher has finished and is clean."}, "o": [{"k": "a", "de": "ich räume sie aus", "en": "I unload it"}, {"k": "b", "de": "ich nehme heraus, was ich brauche", "en": "I take out what I need"}, {"k": "c", "de": "sie hat da ein System, das lasse ich", "en": "she has a system, I leave it"}]}, {"id": "q086", "sec": "faelle", "type": "choice", "t": {"de": "Ihre Partnerin widerspricht Ihnen vor Freunden. Sie …", "en": "Your partner contradicts you in front of friends. You …"}, "o": [{"k": "a", "de": "diskutieren das ganz normal", "en": "discuss it normally"}, {"k": "b", "de": "sprechen es später unter vier Augen an", "en": "bring it up later in private"}, {"k": "c", "de": "finden das respektlos", "en": "find that disrespectful"}, {"k": "d", "de": "merken sich das", "en": "remember that"}]}, {"id": "q087", "sec": "faelle", "type": "choice", "t": {"de": "Ein Freund bekommt die Beförderung, um die Sie sich auch beworben hatten.", "en": "A friend gets the promotion you also applied for."}, "o": [{"k": "a", "de": "ich freue mich für ihn", "en": "I'm happy for him"}, {"k": "b", "de": "gemischte Gefühle, aber ich gratuliere", "en": "mixed feelings, but I congratulate him"}, {"k": "c", "de": "ich frage mich, was er besser gemacht hat als ich", "en": "I wonder what he did better than me"}, {"k": "d", "de": "der Chef mag ihn halt", "en": "the boss just likes him"}]}, {"id": "q088", "sec": "faelle", "type": "choice", "t": {"de": "Sie sind im Supermarkt, Ihre Partnerin schreibt: „Bring bitte Tampons mit.“", "en": "You're at the supermarket, your partner texts: “Please bring tampons.”"}, "o": [{"k": "a", "de": "ich frage nach Größe oder Marke", "en": "I ask about size or brand"}, {"k": "b", "de": "ich schicke ein Foto vom Regal", "en": "I send a photo of the shelf"}, {"k": "c", "de": "ist mir ehrlich gesagt unangenehm", "en": "honestly, that's uncomfortable for me"}, {"k": "d", "de": "das macht sie besser selbst", "en": "she'd better get those herself"}]}, {"id": "q089", "sec": "faelle", "type": "choice", "t": {"de": "Sie schreiben Ihrer Partnerin, sechs Stunden keine Antwort. Was geht in Ihnen vor?", "en": "You text your partner, no reply for six hours. What goes through your mind?"}, "o": [{"k": "a", "de": "nichts, ich lebe mein Leben", "en": "nothing, I live my life"}, {"k": "b", "de": "kurz unsicher, dann frage ich normal nach", "en": "a bit unsure, then I ask normally"}, {"k": "c", "de": "ich schreibe nochmal", "en": "I text again"}, {"k": "d", "de": "ich antworte dann auch sechs Stunden nicht", "en": "I don't reply for six hours either"}]}, {"id": "q090", "sec": "faelle", "type": "choice", "t": {"de": "Sie haben Ihre Partnerin verletzt. Was tun Sie danach?", "en": "You've hurt your partner. What do you do next?"}, "o": [{"k": "a", "de": "Verantwortung übernehmen und konkret etwas ändern", "en": "take responsibility and change something concrete"}, {"k": "b", "de": "Raum geben und abwarten", "en": "give space and wait"}, {"k": "c", "de": "entschuldigen und weitermachen", "en": "apologise and move on"}, {"k": "d", "de": "erklären, warum es eigentlich   var n=0; SPEC.ref.forEach(function(it){ h+=qHtml(it,++n,r.ans); });
  h+='<div class="err" id="err" role="alert"></div><div class="nav"><button class="btn" data-act="refSubmit">'+t.rSubmit+'</button></div>'+foot();
  root.innerHTML=h; window.scrollTo(0,0);
}
function submitRef(btn){var t=L(),r=state.ref;
  btn.disabled=true; btn.textContent=t.sending;
  var payload={type:"reference",v:3,lang:state.lang,az:refAz,rel:r.rel||"other",close:r.close||"",by:r.by||"",ans:r.ans,fcOrder:state.fcOrder,t:Date.now()};
  post(payload).then(function(res){ if(!res||!res.ok) throw new Error("bad"); renderRefDone(null); })
  .catch(function(){ renderRefDone(encode(payload,"RF")); });
}
function renderRefDone(fallbackCode){var t=L();
  root.innerHTML=top()+'<div class="herocard"><span class="chip">'+t.rTitle+'</span><h1 style="margin-top:16px">'+t.rDoneT+'</h1><p class="lead">'+t.rDoneP+'</p>'+
  (fallbackCode?'<p class="lead" style="margin-top:20px"><b>'+t.fallbackT+'</b> '+t.fallbackP+'</p><div class="code">'+fallbackCode+'</div><div style="margin-top:12px"><button class="btn ghost" data-copy="'+esc(fallbackCode)+'" style="width:100%">'+t.copy+'</button></div>':'')+'</div>'+foot();
}
function copyText(txt,btn){var ok=function(){var o=btn.textContent;btn.textContent=L().copied;setTimeout(function(){btn.textContent=o;},1800);};
  var fb=function(){var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}document.body.removeChild(ta);};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,fb); else fb();}
/* ---------- Events ---------- */
root.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-lang")){ if(refAz){collect(SPEC.ref,state.ref.ans,null);} state.lang=b.getAttribute("data-lang"); document.documentElement.lang=state.lang; refAz?renderRef():renderIntro(); return; }
  if(b.hasAttribute("data-copy")){ copyText(b.getAttribute("data-copy"),b); return; }
  if(b.hasAttribute("data-share")){ navigator.share({text:b.getAttribute("data-share")}).catch(function(){}); return; }
  var sec=SECS[state.step]&&SECS[state.step].id;
  switch(b.getAttribute("data-act")){
    case "start": state.step=0; state.startT=Date.now(); renderStep(); break;
    case "next": collect(ITEMS,state.form.ans,sec); if(!valid(ITEMS,state.form.ans,sec)){document.getElementById("err").textContent=L().req;return;} state.step++; renderStep(); break;
    case "back": collect(ITEMS,state.form.ans,sec); state.step--; renderStep(); break;
    case "submit": collect(ITEMS,state.form.ans,sec); if(!valid(ITEMS,state.form.ans,sec)){document.getElementById("err").textContent=L().req;return;} submitApp(b); break;
    case "refSubmit": collect(SPEC.ref,state.ref.ans,null); if(!valid(SPEC.ref,state.ref.ans,null)){document.getElementById("err").textContent=L().req;return;} submitRef(b); break;
  }
});
/* ---------- Start ---------- */
document.documentElement.lang=state.lang;
if(refAz){ if(/^KA-\d{4}-[A-Z0-9]{4}$/.test(refAz)){ renderRef(); post({type:"refclick",az:refAz,t:Date.now()}).catch(function(){}); } else { root.innerHTML=top()+'<div class="herocard"><h1>'+L().rMissing+'</h1></div>'; } }
else renderIntro();
})();
</script>
